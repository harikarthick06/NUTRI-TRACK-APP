server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API lives on the same origin, so the refresh cookie stays first-party.
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port, so Spring sees the browser's Origin as same-origin (no CORS rejection).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
