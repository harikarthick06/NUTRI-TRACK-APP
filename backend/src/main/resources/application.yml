server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: nutritrack
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nutritrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:nutritrack}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

nutritrack:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    # Set COOKIE_SECURE=true whenever the API is served over HTTPS.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Strict}
  providers:
    usda:
      enabled: ${USDA_FDC_ENABLED:false}
      api-key: ${USDA_FDC_API_KEY:}
      base-url: ${USDA_FDC_BASE_URL:https://api.nal.usda.gov/fdc/v1}
    openfoodfacts:
      enabled: ${OPENFOODFACTS_ENABLED:false}
      base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
      user-agent: ${OPENFOODFACTS_USER_AGENT:NutriTrack/1.0 (contact not configured)}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
